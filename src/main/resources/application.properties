# ??? App ???????????????????????????????????????????????
spring.application.name=quickdeliver

# ??? MySQL ?????????????????????????????????????????????
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ??? JPA ???????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ??? Server ????????????????????????????????????????????
server.port=${PORT:8080}
server.servlet.context-path=/api

# ??? JWT ???????????????????????????????????????????????
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ??? PhonePe ???????????????????????????????????????????
phonepe.client.id=${PHONEPE_CLIENT_ID}
phonepe.client.secret=${PHONEPE_CLIENT_SECRET}
phonepe.client.version=1
phonepe.base.url=${PHONEPE_BASE_URL}
phonepe.redirect.url=${PHONEPE_REDIRECT_URL}
phonepe.callback.url=${PHONEPE_CALLBACK_URL}

# ??? Fast2SMS ??????????????????????????????????????????
fast2sms.api.key=${FAST2SMS_KEY:none}

# ??? Geocoding ?????????????????????????????????????????
geocoding.nominatim.url=https://nominatim.openstreetmap.org/reverse
geocoding.nominatim.user-agent=${NOMINATIM_USER_AGENT}

# ??? Location ??????????????????????????????????????????
app.location.radius.km=50

# ??? File Upload ???????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ??? Logging ???????????????????????????????????????????
logging.level.com.quickdeliver=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ??? Telegram Notifications ????????????????????????????
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID}